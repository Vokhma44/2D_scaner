name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: netscan_test
          POSTGRES_USER: netscan
          POSTGRES_PASSWORD: netscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netscan -d netscan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETSCAN_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/netscan_test
      NETSCAN_TEST_DB_USER: netscan
      NETSCAN_TEST_DB_PASSWORD: netscan_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify version consistency
        shell: bash
        run: |
          gradle_version="$(sed -n 's/^netscanVersion=//p' gradle.properties)"
          mobile_version="$(node -p "require('./mobile/package.json').version")"
          test "$gradle_version" = "$mobile_version"

      - name: Test mobile offline queue
        working-directory: mobile
        run: npm test

      - name: Test server and agent
        run: ./gradlew :server:test :agent:test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            agent/build/reports/tests/
            server/build/reports/tests/
          if-no-files-found: ignore

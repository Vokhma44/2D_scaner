name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Test server and build agent distribution
        shell: pwsh
        run: .\gradlew.bat :server:test :agent:test :agent:installDist --no-daemon

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            $buildFile = Get-Content agent\build.gradle.kts -Raw
            $match = [regex]::Match($buildFile, '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"')
            if (-not $match.Success) { throw 'Не удалось определить версию агента' }
            $version = $match.Groups[1].Value
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build self-contained Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\package | Out-Null
          $mainJar = (Get-ChildItem agent\build\install\netscan\lib\agent-*.jar | Select-Object -First 1).Name
          jpackage `
            --type app-image `
            --name netscan `
            --app-version "${{ steps.version.outputs.version }}" `
            --input agent\build\install\netscan\lib `
            --main-jar $mainJar `
            --main-class ru.ruznak.netscan.MainKt `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Dstdout.encoding=UTF-8" `
            --java-options "-Dstderr.encoding=UTF-8" `
            --dest build\package
          Compress-Archive `
            -Path build\package\netscan `
            -DestinationPath "build\netscan-windows-${{ steps.version.outputs.version }}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: netscan-windows-${{ steps.version.outputs.version }}
          path: build/netscan-windows-*.zip

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/netscan-windows-*.zip
          generate_release_notes: true
